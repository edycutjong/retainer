name: E2E

# End-to-end checks against a real production build, plus the two budgets that are easy to
# blow without noticing: bundle size and Lighthouse.
#
# Separate from Lint (unit + contract tests + typecheck) and from Deploy (verify → Vercel →
# live smoke test) on purpose. Those two gate correctness and the production promotion; this
# one is slower, needs a browser, and should be able to fail without blocking a deploy of code
# whose contracts and types are provably fine.
#
# Everything here runs with an empty environment. That is a property of the SUITE, not of the
# product: Retainer has no offline or mock mode, and its paid path is proven against the live
# Hedera testnet in docs/proof.md. What these assert is that the gate FAILS CLOSED when it is
# not configured — a cold agent must never be served, whatever went wrong upstream.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright
    runs-on: ubuntu-latest
    # Least privilege: these jobs only read the repo.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Production build
        run: yarn next:build

      - name: Bundle budget
        # First Load JS shared by all was 103 kB when this budget was set. The threshold is a
        # tripwire for an accidental import of something enormous, not a target to optimise to.
        run: |
          set -euo pipefail
          static="packages/nextjs/.next/static"
          test -d "$static" || { echo "::error::no build output at $static"; exit 1; }
          size=$(du -sk "$static" | cut -f1)
          echo "static assets: ${size} KB"
          echo "Static assets: ${size} KB" >> "$GITHUB_STEP_SUMMARY"
          if [ "$size" -gt 8000 ]; then
            echo "::error::bundle ${size} KB exceeds the 8000 KB hard limit"
            exit 1
          elif [ "$size" -gt 6000 ]; then
            echo "::warning::bundle ${size} KB exceeds the 6000 KB warning threshold"
          fi

      # `--with-deps` runs `apt-get update` across every repo the runner image has configured,
      # including Google's Chrome repo — which we do not use, because Playwright downloads its own
      # chromium build. On 2026-09-09 that repo published a bad index (`Hash Sum mismatch` on
      # `dl.google.com/linux/chrome-stable/deb`) and took this job down four times in a row, on
      # branches that had not touched a line of UI code. A red E2E badge on a public repo during
      # judging is a claim about our tests, so it should not be able to mean "Google was mid-publish".
      # The repo we do not need is dropped, and one retry covers an ordinary transient.
      - name: Install Playwright browsers
        run: |
          # The list file is not always named google-chrome.list (the image has used deb822
          # `.sources` too), so match on the host rather than guessing the filename. Only files
          # under sources.list.d are removed; the main sources.list is edited line-wise, never
          # deleted, because apt needs it.
          for f in $(grep -rl 'dl\.google\.com' /etc/apt/sources.list.d 2>/dev/null || true); do
            echo "removing unused apt source: $f"
            sudo rm -f "$f"
          done
          sudo sed -i '/dl\.google\.com/d' /etc/apt/sources.list || true
          yarn playwright install --with-deps chromium && exit 0
          echo "::warning::first browser install failed — retrying once"
          sleep 30
          yarn playwright install --with-deps chromium

      - name: Run E2E tests
        run: yarn playwright test

      - name: Upload the report when something fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  lighthouse:
    name: Lighthouse (advisory)
    runs-on: ubuntu-latest
    # Least privilege: these jobs only read the repo.
    permissions:
      contents: read
    # Advisory on purpose. A performance or SEO regression is worth knowing about; it is not
    # worth blocking a submission on, and the thresholds in lighthouserc.json are all warnings.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Production build
        run: yarn next:build

      - name: Lighthouse CI
        run: yarn lighthouse
