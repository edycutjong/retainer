name: gitleaks

# GitHub's own secret scanning only matches known provider patterns, and only on the commits
# it sees pushed. This scans the FULL history for project-shaped secrets too — an ECDSA
# operator key, a Hedera account id, a RETAINER_SERVER_KEY pasted into an example file.
#
# The rule this enforces: credentials live in ~/.config/retainer/, never in the tree. This
# repo was public from commit 1, so "sanitise before the flip" was never available — the
# history has to be clean continuously, and this is what checks that it still is.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  scan:
    name: Scan full history
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # gitleaks-action v3 uploads a report artifact, which v2 did not. Under this repo's
      # read-only default token that upload fails the job with a 403 AFTER the scan has
      # already passed — "no leaks found" followed by FinalizeArtifact: Forbidden. The scan
      # needs nothing beyond contents:read; this grant is for the upload alone.
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the whole point is to scan the past, not just the tip

      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
