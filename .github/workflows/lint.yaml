name: Lint

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]
        node: [lts/*]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup node env
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node }}
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Compile Hardhat contracts
        run: yarn hardhat:compile

      - name: Run Hardhat unit tests
        run: yarn hardhat:test

      # The TypeScript half had no test of its own. This is the unit boundary suite: the
      # tinybar/weibar conversion verified across 202,059 amounts rather than at examples,
      # plus the regressions named for the money bugs that produced it.
      - name: Run resource-server unit tests
        run: yarn next:test

      - name: Run nextjs lint
        run: yarn next:lint --max-warnings=0

      - name: Check typings on nextjs
        run: yarn next:check-types

      - name: Run hardhat lint
        run: yarn hardhat:lint --max-warnings=0
