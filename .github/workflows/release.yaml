name: release

# A push to main is the trigger. The version is not chosen — it is read out of the commits with
# the Angular convention (scripts/next-version.mjs): feat -> minor, fix/perf -> patch, a "!" or a
# BREAKING CHANGE footer -> major, anything else -> no release at all.
#
# Pushing a v* tag by hand still works, for the times a release has to be cut deliberately.
on:
  push:
    branches: [main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  automatic:
    # Only for branch pushes. The bot's own release commit is skipped, so this cannot loop —
    # belt and braces, since "chore(release)" is a no-release type anyway.
    if: github.ref == 'refs/heads/main' && !startsWith(github.event.head_commit.message, 'chore(release)')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Read the next version out of the commits
        id: next
        run: |
          VERSION="$(node scripts/next-version.mjs --explain)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if [ "$VERSION" = "none" ]; then
            echo "No releasable commit since the last tag — nothing to publish."
          fi

      - name: Bump, commit and tag
        if: steps.next.outputs.version != 'none'
        env:
          VERSION: ${{ steps.next.outputs.version }}
        run: |
          for f in package.json packages/nextjs/package.json packages/hardhat/package.json; do
            node -e '
              const fs = require("fs");
              const [file, version] = process.argv.slice(1);
              const before = fs.readFileSync(file, "utf8");
              const after = before.replace(/("version"\s*:\s*)"[^"]+"/, `$1"${version}"`);
              if (before === after) { console.error(`no version field in ${file}`); process.exit(1); }
              fs.writeFileSync(file, after);
            ' "$f" "$VERSION"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json packages/nextjs/package.json packages/hardhat/package.json
          git commit -m "chore(release): v${VERSION} [skip ci]"
          git tag -a "v${VERSION}" -m "v${VERSION}"
          git push origin HEAD:main
          git push origin "v${VERSION}"

      - name: Create the GitHub Release
        if: steps.next.outputs.version != 'none'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.next.outputs.version }}
          name: v${{ steps.next.outputs.version }}
          generate_release_notes: true

  manual:
    # The deliberate path: someone ran `yarn release:<level>` and pushed the tag themselves.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check the tag matches the version in the manifest
        run: |
          MANIFEST="v$(node -p "require('./package.json').version")"
          if [ "$MANIFEST" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match package.json ${MANIFEST}" >&2
            exit 1
          fi
          echo "${GITHUB_REF_NAME} matches the manifest"

      - name: Create the GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
