# Local infrastructure for the x402 pay-per-use template:
#   - minio        : private S3-compatible object storage (no AWS)
#   - minio-init   : one-shot job that creates the private bucket
#   - facilitator  : self-hosted x402 Hedera facilitator (verify/settle)
#
# Start with `yarn infra:up`, stop with `yarn infra:down`.
# Values are read from the repo-root `.env` (see `.env.example`).

services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web console
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio-data:/data
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 '${MINIO_ROOT_USER:-minioadmin}' '${MINIO_ROOT_PASSWORD:-minioadmin}'; do
        echo 'waiting for minio...'; sleep 1;
      done;
      mc mb --ignore-existing local/'${S3_BUCKET:-x402-files}';
      mc anonymous set none local/'${S3_BUCKET:-x402-files}';
      echo 'MinIO ready: private bucket ${S3_BUCKET:-x402-files} created';
      "

  facilitator:
    build: ./facilitator
    ports:
      - "${FACILITATOR_PORT:-4020}:4020"
    environment:
      PORT: 4020
      X402_NETWORK: ${X402_NETWORK:-hedera:testnet}
      FACILITATOR_ACCOUNT_ID: ${FACILITATOR_ACCOUNT_ID}
      FACILITATOR_PRIVATE_KEY: ${FACILITATOR_PRIVATE_KEY}
      HEDERA_NODE_URL: ${HEDERA_NODE_URL:-}
    restart: unless-stopped

volumes:
  minio-data:
