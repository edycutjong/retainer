<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 880" width="940" height="880" role="img" aria-label="Retainer architecture: a payment rail that settles once through Blocky402 on Hedera, joined by subscribeFor to a renewal rail where the Hedera Schedule Service calls renew on the contract unattended.">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#59636e"/></marker><marker id="arrowAccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0969da"/></marker><marker id="arrowOk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker></defs>
<rect width="940" height="880" fill="#ffffff"/>
<rect x="20" y="20" width="900" height="330" rx="10" fill="#eaeef2" stroke="#d0d7de" stroke-width="1"/>
<text x="40" y="48" fill="#59636e" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="700" text-anchor="start">PAYMENT RAIL</text>
<text x="150" y="48" fill="#59636e" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" text-anchor="start">once, at the start — the only thing the agent ever signs</text>
<rect x="45" y="72" width="175" height="62" rx="8" fill="#f6f8fa" stroke="#0969da" stroke-width="1.5"/>
<text x="132" y="98" fill="#1f2328" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" text-anchor="middle">Agent</text>
<text x="132" y="118" fill="#59636e" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" text-anchor="middle">holds a wallet</text>
<rect x="400" y="72" width="250" height="62" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
<text x="525" y="96" fill="#1f2328" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" text-anchor="middle">Resource server</text>
<text x="525" y="116" fill="#59636e" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11" font-weight="400" text-anchor="middle">Next.js · reads hasAccess(agent)</text>
<rect x="400" y="176" width="250" height="66" rx="8" fill="#f6f8fa" stroke="#8250df" stroke-width="1.5"/>
<text x="525" y="200" fill="#1f2328" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" text-anchor="middle">Blocky402 facilitator</text>
<text x="525" y="219" fill="#59636e" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" text-anchor="middle">co-signs as fee payer,</text>
<text x="525" y="233" fill="#59636e" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" text-anchor="middle">submits TransferTransaction</text>
<rect x="400" y="274" width="250" height="52" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
<text x="525" y="297" fill="#1f2328" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" text-anchor="middle">Hedera testnet</text>
<text x="525" y="315" fill="#59636e" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" text-anchor="middle">payment settled</text>
<line x1="222" y1="88" x2="400" y2="88" stroke="#59636e" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="311" y="83" fill="#59636e" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="10.5" font-weight="400" text-anchor="middle">1  GET /api/retainer/access</text>
<line x1="400" y1="104" x2="222" y2="104" stroke="#59636e" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="311" y="99" fill="#59636e" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="10.5" font-weight="400" text-anchor="middle">2  402 + payment requirements</text>
<line x1="222" y1="120" x2="400" y2="120" stroke="#59636e" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="311" y="115" fill="#59636e" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="10.5" font-weight="400" text-anchor="middle">3  sign, then retry with payment header</text>
<line x1="525" y1="136" x2="525" y2="174" stroke="#8250df" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="538" y="160" fill="#59636e" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="10.5" font-weight="400" text-anchor="start">4  verify + settle</text>
<line x1="525" y1="244" x2="525" y2="272" stroke="#59636e" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="660" y1="300" x2="760" y2="300" stroke="#59636e" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="770" y="296" fill="#59636e" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="10.5" font-weight="400" text-anchor="start">5  200 +</text>
<text x="770" y="310" fill="#59636e" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="10.5" font-weight="400" text-anchor="start">settlement ref</text>
<rect x="215" y="368" width="510" height="74" rx="10" fill="#fff8c5" stroke="#d4a72c" stroke-width="1.5"/>
<text x="470" y="392" fill="#1f2328" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle">THE JOIN</text>
<text x="470" y="414" fill="#1f2328" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="14" font-weight="600" text-anchor="middle">RetainerAccess.subscribeFor(agent) { value }</text>
<text x="470" y="432" fill="#59636e" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" text-anchor="middle">the server forwards what it just received, on-chain</text>
<line x1="470" y1="340" x2="470" y2="366" stroke="#0969da" stroke-width="1.8" marker-end="url(#arrowAccent)"/>
<rect x="20" y="460" width="900" height="400" rx="10" fill="#eaeef2" stroke="#d0d7de" stroke-width="1"/>
<text x="40" y="488" fill="#59636e" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="700" text-anchor="start">RENEWAL RAIL</text>
<text x="160" y="488" fill="#59636e" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" text-anchor="start">from here on, unattended — no user, no server job, no cron</text>
<rect x="90" y="506" width="760" height="92" rx="8" fill="#f6f8fa" stroke="#1a7f37" stroke-width="1.5"/>
<text x="110" y="530" fill="#1f2328" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" text-anchor="start">RetainerAccess.sol</text>
<text x="272" y="530" fill="#59636e" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" text-anchor="start">Hedera testnet</text>
<text x="110" y="553" fill="#59636e" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" font-weight="400" text-anchor="start">charges period 1, sets expiresAt</text>
<text x="110" y="572" fill="#1f2328" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" font-weight="400" text-anchor="start">hasScheduleCapacity(expiresAt, gas)</text>
<text x="360" y="572" fill="#59636e" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" text-anchor="start">ask the network first</text>
<text x="110" y="590" fill="#1f2328" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" font-weight="400" text-anchor="start">scheduleCall(this, expiresAt, gas, renew(agent))</text>
<text x="430" y="590" fill="#59636e" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" text-anchor="start">arm it</text>
<line x1="470" y1="600" x2="470" y2="634" stroke="#1a7f37" stroke-width="1.8" marker-end="url(#arrowOk)"/>
<text x="484" y="622" fill="#59636e" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" text-anchor="start">at expiresAt, with no caller</text>
<rect x="150" y="636" width="640" height="62" rx="8" fill="#f6f8fa" stroke="#1a7f37" stroke-width="1.5"/>
<text x="470" y="660" fill="#1f2328" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" text-anchor="middle">Hedera Schedule Service</text>
<text x="470" y="681" fill="#59636e" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11" font-weight="400" text-anchor="middle">HIP-1215 · system contract 0x16b · executes CONTRACTCALL, scheduled=true</text>
<line x1="470" y1="700" x2="470" y2="726" stroke="#1a7f37" stroke-width="1.8" marker-end="url(#arrowOk)"/>
<rect x="90" y="728" width="760" height="66" rx="8" fill="#f6f8fa" stroke="#1a7f37" stroke-width="1.5"/>
<text x="110" y="752" fill="#1f2328" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="14" font-weight="600" text-anchor="start">renew(agent)</text>
<text x="110" y="774" fill="#59636e" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" text-anchor="start">charge next period · extend the window · arm the following renewal</text>
<path d="M850 761 L890 761 L890 552 L852 552" fill="none" stroke="#1a7f37" stroke-width="1.8" marker-end="url(#arrowOk)"/>
<text x="470" y="818" fill="#59636e" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" text-anchor="middle">loops until the balance or the gas reserve runs out, or the subscriber cancels — always with an event</text>
<text x="470" y="840" fill="#1f2328" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" text-anchor="middle">Later requests ask one on-chain question: hasAccess(agent) → 200, nothing paid.</text>
</svg>